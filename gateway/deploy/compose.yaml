name: payoff

x-gateway-image: &gateway-image
  image: payoff-rfq-gateway:local
  build:
    context: ../..
    dockerfile: gateway/Dockerfile

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: payoff
      POSTGRES_DB: payoff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random database password in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U payoff -d payoff"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *gateway-image
    command: [node, dist/migrate.js]
    environment:
      DATABASE_URL: postgresql://payoff:${POSTGRES_PASSWORD}@postgres:5432/payoff
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    <<: *gateway-image
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://payoff:${POSTGRES_PASSWORD}@postgres:5432/payoff
      GATEWAY_CONFIG_PATH: /run/payoff/config.json
      XLAYER_RPC_URL: ${XLAYER_RPC_URL:?Set the deployed chain RPC}
      SELF_DEALER_API_TOKEN: ${SELF_DEALER_API_TOKEN:?Set the shared dealer token}
      HOST: 0.0.0.0
      NODE_ENV: production
    volumes:
      - ../config.local.json:/run/payoff/config.json:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    networks:
      database:
      dealers:
      edge:
        ipv4_address: 172.30.0.2
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 45s

  self-dealer:
    image: payoff-self-dealer:local
    build:
      context: ../..
      dockerfile: dealer/Dockerfile
    restart: unless-stopped
    init: true
    env_file: dealer.env
    environment:
      DEALER_CONFIG_PATH: /run/payoff/config.json
      DEALER_BID_CACHE_PATH: /var/lib/payoff-dealer/last-valid-bids.json
      DEALER_SETTLEMENT_PATH: /var/lib/payoff-dealer/settlement.json
      DEALER_SETTLEMENT_TX_PATH: /var/lib/payoff-dealer/settlement-transactions.json
      XLAYER_RPC_URL: ${XLAYER_RPC_URL:?Set the deployed chain RPC}
      SELF_DEALER_API_TOKEN: ${SELF_DEALER_API_TOKEN:?Set the shared dealer token}
    volumes:
      - ../../dealer/config.local.json:/run/payoff/config.json:ro
      - dealer_data:/var/lib/payoff-dealer
    networks: [dealers]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  proxy:
    image: caddy:2.10.2
    restart: unless-stopped
    environment:
      GATEWAY_SITE: ${GATEWAY_SITE:?Set an API domain or http://server-ip for initial IP deployment}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports: ["80:80", "443:443"]
    networks:
      edge:
        ipv4_address: 172.30.0.3
    depends_on: [gateway]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  dealer_data:

networks:
  database:
    internal: true
  dealers:
    name: payoff_dealers
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/28
