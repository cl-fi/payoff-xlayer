name: Frontend checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --workspace @payoff/web --include-workspace-root=false
      - run: npm run format:check --workspace @payoff/web
      - run: npm run test:web
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:web:e2e
      - run: npm run test:e2e:testnet --workspace @payoff/web
      - run: npm run test:e2e:gateway --workspace @payoff/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: web/test-results
          retention-days: 7
