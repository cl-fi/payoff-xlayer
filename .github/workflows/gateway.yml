name: RFQ gateway checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payoff_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: payoff_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payoff_test -d payoff_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://payoff_test:local_ci_only@127.0.0.1:5432/payoff_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:gateway
      - run: npm run build
      - run: npm run test:gateway
      - run: npm run test:dealer
      - run: python3 -m unittest discover -s dealer/test -p '*_test.py'
      - run: npm run test:gateway:integration
      - run: npm run test:integration --workspace @payoff/self-dealer
      - run: npm run test:sdk
      - run: docker build -f gateway/Dockerfile -t payoff-rfq-gateway:ci .
      - run: docker build -f dealer/Dockerfile -t payoff-self-dealer:ci .
